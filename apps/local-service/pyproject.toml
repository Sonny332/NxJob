[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nxjob-local-service"
version = "0.7.0"
description = "NxJob local FastAPI service"
readme = "../../README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "python-docx>=1.1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.2"
]

[project.scripts]
nxjob-local-service = "nxjob.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/nxjob"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

